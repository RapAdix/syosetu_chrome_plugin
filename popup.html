<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Jisho Helper</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div id="mainMenu" style="width: 148px;">
      <div class="settings-group">
        <div class="switch-container">
          <span class="switch-text">Turn on Jisho Assistant</span>
          <label class="switch-label switch">
            <input type="checkbox" id="jishoSwitch">
            <span class="slider"></span>
          </label>
        </div>

        <div class="switch-container">
          <span class="switch-text">Enable on this site</span>
          <button id="siteListChevron" class="chevron-btn">
            <i class="fa-solid fa-chevron-down"></i>
          </button>
          <label class="switch-label switch">
            <input type="checkbox" id="toggleSite">
            <span class="slider"></span>
          </label>
        </div>

        <div id="siteListDropdown" class="dropdown-hidden">
          <label>Enabled sites:</label>
          <textarea class="settings-field" id="allowedSitesInput"></textarea>

          <button class="settings-action-btn" id="saveAllowedSitesButton">Save</button>
        </div>
      </div>

      <div class="settings-group">
        <label>
          Panel width (% of view): 
          <input type="number" class="settings-field" id="panelWidthInput" min="10" max="90">
        </label>

        <label>
          Jisho content scale (%): 
          <input type="number" class="settings-field" id="jishoScaleInput"min="50" max="200">
        </label>

        <label>
          Grammar content scale (%): 
          <input type="number" class="settings-field" id="grammarScaleInput" min="50" max="200">
        </label>
      </div>

      <div class="btn-row">
        <button class="settings-action-btn" id="clearCacheButton">Clear Cache</button>
        <button class="settings-action-btn" id="resetSettingsButton">Reset Settings</button>
        <button class="settings-action-btn" id="apiSettingsButton">Api Keys settings</button>
      </div>

    </div>
    
    <div id="apiSettings" style="display:none;">
      <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      />
      <button class="settings-action-btn" id="backToMainButton"><i class="fa fa-arrow-left"></i> Back</button>

      <h3>API Keys & Models</h3>
      <div>
        <label>OpenAI Key:</label>
        <div style="position: relative; margin-top: 3px;">
          <input type="password" id="openaiApiKey" placeholder="sk-..." class="settings-field" style="padding: 2px 35px 5px 6px;"/>
          <button type="button" id="toggleOpenaiKey" 
                  style="position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
                        background: transparent; border: none; cursor: pointer; padding: 5px;">
            <i class="fa fa-eye"></i>
          </button>
        </div>
      </div>

      <div>
        <label>Gemini Key:</label>
        <div style="position: relative; margin-top: 3px;">
          <input type="password" id="geminiApiKey" placeholder="..." class="settings-field" style="padding: 2px 35px 5px 6px;"/>
          <button type="button" id="toggleGeminiKey" 
                  style="position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
                        background: transparent; border: none; cursor: pointer; padding: 5px;">
            <i class="fa fa-eye"></i>
          </button>
        </div>
      </div>

      <div>
        <label>Use provider:</label>
        <select class="settings-field" id="providerSelect"></select>
      </div>

      <div id="modelSection">
        <label>Model:</label>
        <select class="settings-field" id="modelSelect"></select>
        <input type="text" id="customModelInput" placeholder="Enter custom model..." class="settings-field" style="display: none; margin-top: 4px;" />
        <div id="modelStatusNotice" style="font-size: 11px; color: #c5221f; margin-top: 4px; display: none;"></div>
      </div>

      <div id="serverAuthSection" style="display: none; margin-top: 6px;">
        <div id="serverLoginForm">
          <div>
            <label>Username:</label>
            <input type="text" id="serverUsernameInput" placeholder="Username" class="settings-field" />
          </div>
          <div style="margin-top: 4px;">
            <label>Password:</label>
            <input type="password" id="serverPasswordInput" placeholder="Password" class="settings-field" />
          </div>
          <button class="settings-action-btn" id="serverLoginButton" style="margin-top: 6px;">Log In</button>
        </div>

        <div id="serverLoggedInView" style="display: none; margin-top: 6px;">
          <div id="serverStatusText" style="font-size: 12px; font-weight: bold; color: #188038; margin-bottom: 4px;"></div>
          <div style="font-size: 11px; color: #555; margin-bottom: 6px;">Model: Auto (set on server)</div>
          <button class="settings-action-btn" id="serverLogoutButton">Log Out</button>
        </div>
      </div>

      <button class="settings-action-btn" id="saveKeys">Save Keys</button>
      <button class="settings-action-btn" id="deleteKeys">Delete Keys</button>
    </div>
    <div id="statusMessage"></div>

    <script src="defaults.js"></script>
    <script src="helpers.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
